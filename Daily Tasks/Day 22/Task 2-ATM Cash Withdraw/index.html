<!DOCTYPE html>
<html>
<head>
    <title>ATM Cash Withdrawal</title>
</head>
<body>
    <h2>ATM Cash Withdrawal</h2>

    <label>Enter ATM PIN:</label>
    <input type="password" id="pin" placeholder="Enter 4-digit PIN">
    <br><br>

    <label>Enter Total Amount:</label>
    <input type="number" id="amt" placeholder="Enter amount">
    <br><br>

    <label>Enter Withdrawal Amount:</label>
    <input type="number" id="amount" placeholder="Enter amount">
    <br><br>

    <button onclick="withdrawCash()">Withdraw</button>

    <p id="result"></p>

    <script src="script.js"></script>
</body>
</html>
